# Add inside the server { } block of the nginx that serves /football/.
# The nginx container must be on the "football-net" Docker network:
#   docker network connect football-net <nginx-container>
location /football/api/ {
    resolver 127.0.0.11 valid=30s;
    set $football_api http://football-api:8000;
    proxy_pass $football_api;
    client_max_body_size 300k;
}
