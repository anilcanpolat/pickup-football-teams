<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1d7444">
<link rel="icon" href="football.ico" sizes="any">
<title>Halı Saha</title>
<meta name="description" content="Halı saha için dengeli takım kurma yardımcısı.">
<style>
:root{
  --bg:#f3f5f1;--card:#ffffff;--ink:#16201a;--muted:#66746a;--line:#dfe5dd;
  --accent:#1d7444;--accent-ink:#ffffff;--accent-soft:#e3f1e8;--danger:#b3261e;
  --a:#d4473a;--a-soft:#fbe8e5;--b:#2c6bd2;--b-soft:#e4ecfb;--chip:#edf1ec;
  --nav-h:62px;
}
@media (prefers-color-scheme:dark){:root{
  --bg:#0e1410;--card:#17201a;--ink:#e5ebe6;--muted:#97a69b;--line:#29352c;
  --accent:#43b06e;--accent-ink:#06130b;--accent-soft:#1c3324;--danger:#ff8a80;
  --a:#ef6a5c;--a-soft:#3a201d;--b:#5d95ee;--b-soft:#1b2a44;--chip:#212d24;
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-text-size-adjust:100%;
  padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 8px)}
button,input,select{font:inherit;color:inherit}
.wrap{max-width:720px;margin:0 auto;padding:12px 14px}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
h1{font-size:18px;margin:0}
h2{font-size:16px;margin:0 0 10px}
.langs{display:flex;gap:2px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:2px}
.langs button{border:0;background:transparent;border-radius:8px;padding:5px 9px;cursor:pointer;font-size:13px;font-weight:600;color:var(--muted)}
.langs button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:12px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.between{justify-content:space-between}
.muted{color:var(--muted)} .small{font-size:13px}
.btn{border:1px solid var(--line);background:var(--card);min-height:44px;padding:0 16px;border-radius:12px;cursor:pointer;font-weight:600}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.block{width:100%}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted);min-height:36px;padding:0 8px}
.btn.danger{color:var(--danger)}
.btn:disabled{opacity:.45;cursor:not-allowed}
input[type=text],input[type=date]{width:100%;min-height:46px;padding:0 12px;border:1px solid var(--line);border-radius:12px;background:var(--bg)}
label.f{display:block;font-weight:600;font-size:14px;margin:14px 0 6px}
label.f .opt{font-weight:400;color:var(--muted)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--chip);border-radius:999px;min-height:40px;padding:0 14px;cursor:pointer;font-size:14px;font-weight:600}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.seg{display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.seg button{flex:1;border:0;background:var(--card);min-height:42px;cursor:pointer;border-right:1px solid var(--line);font-weight:600}
.seg button:last-child{border-right:0}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.range-row{display:flex;gap:12px;align-items:center}
.range-row input[type=range]{flex:1;accent-color:var(--accent);height:32px}
.range-val{min-width:40px;text-align:center;font-weight:800;font-size:18px;font-variant-numeric:tabular-nums}
.check{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--muted);cursor:pointer;min-height:36px}
.check input{width:18px;height:18px;accent-color:var(--accent)}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:48px;cursor:pointer}
.switch input{appearance:none;-webkit-appearance:none;width:46px;height:28px;border-radius:99px;background:var(--line);position:relative;flex:none;cursor:pointer;transition:background .15s;margin:0}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:left .15s;box-shadow:0 1px 2px rgba(0,0,0,.3)}
.switch input:checked{background:var(--accent)}
.switch input:checked::after{left:21px}
.switch span small{display:block;color:var(--muted);font-size:12px;font-weight:400}
details.opts summary{cursor:pointer;color:var(--muted);font-size:14px;min-height:36px;display:flex;align-items:center;list-style:none}
details.opts summary::-webkit-details-marker{display:none}
details.opts summary::before{content:"›";display:inline-block;margin-right:8px;transition:transform .15s;font-size:18px}
details.opts[open] summary::before{transform:rotate(90deg)}
.att{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
@media (min-width:520px){.att{grid-template-columns:repeat(3,minmax(0,1fr))}}
.att button{display:flex;align-items:center;gap:8px;text-align:left;border:1px solid var(--line);background:var(--bg);min-height:48px;padding:0 12px;border-radius:12px;cursor:pointer;min-width:0}
.att button .n{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.att button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.box{width:20px;height:20px;border-radius:6px;border:2px solid var(--muted);flex:none;display:grid;place-items:center;font-size:13px;color:var(--accent-ink)}
.att button[aria-pressed="true"] .box{background:var(--accent);border-color:var(--accent)}
.sticky{position:sticky;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 8px);z-index:5;margin-top:12px}
.sticky .btn{box-shadow:0 6px 18px rgba(0,0,0,.18)}
.balance{display:flex;align-items:center;gap:10px;font-weight:700;font-variant-numeric:tabular-nums}
.balance .a{color:var(--a)} .balance .b{color:var(--b)}
.meter{flex:1;height:8px;border-radius:99px;background:var(--b);overflow:hidden}
.meter i{display:block;background:var(--a);height:100%}
.teams{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.team{border-radius:12px;padding:8px;min-width:0}
.team.A{background:var(--a-soft)} .team.B{background:var(--b-soft)}
.team h3{margin:0 0 6px;font-size:14px}
.team.A h3{color:var(--a)} .team.B h3{color:var(--b)}
.tp{display:flex;align-items:center;gap:6px;min-height:40px;padding:0 8px;border-radius:9px;cursor:pointer;background:var(--card);margin-bottom:4px;border:2px solid transparent;font-size:14px}
.tp.sel{border-color:var(--ink)}
.tp .pos{font-size:10px;font-weight:800;min-width:20px;color:var(--muted)}
.tp .nm{flex:1;font-weight:600;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tp .r{font-variant-numeric:tabular-nums;color:var(--muted);font-size:12px}
.pitch-wrap{max-width:420px;margin:0 auto}
svg.pitch{width:100%;height:auto;display:block;border-radius:14px;touch-action:manipulation}
svg.pitch text{font-family:system-ui,-apple-system,sans-serif}
.score{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center}
.stepper{display:flex;align-items:center;justify-content:center;gap:6px}
.stepper button{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--bg);font-size:22px;font-weight:700;cursor:pointer}
.stepper output{min-width:34px;text-align:center;font-size:26px;font-weight:800;font-variant-numeric:tabular-nums}
.prow{display:flex;align-items:center;gap:10px;min-height:52px;padding:0 12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);cursor:pointer;margin-bottom:6px;width:100%;text-align:left}
.prow .nm{font-weight:600;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.prow .rt{font-weight:800;min-width:30px;font-variant-numeric:tabular-nums}
.prow .meta{font-size:12px;color:var(--muted);white-space:nowrap}
.dot{width:7px;height:7px;border-radius:50%;background:#d9a400;flex:none}
.hist{border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:8px;background:var(--bg)}
.hist .sc{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums}
table.st{width:100%;border-collapse:collapse;font-size:14px}
table.st th,table.st td{padding:8px 4px;border-bottom:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums}
table.st th:first-child,table.st td:first-child{text-align:left}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
nav.tabs .in{max-width:720px;margin:0 auto;display:flex}
nav.tabs button{flex:1;height:var(--nav-h);border:0;background:transparent;cursor:pointer;color:var(--muted);font-size:12px;font-weight:600;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
nav.tabs button svg{width:24px;height:24px}
nav.tabs button[aria-selected="true"]{color:var(--accent)}
nav.tabs .flow{flex:none;display:flex;align-items:center;color:var(--muted);opacity:.7}
nav.tabs .flow svg{width:22px;height:22px}
.toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 16px);transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;opacity:0;transition:opacity .2s;pointer-events:none;z-index:20;max-width:calc(100% - 32px)}
.toast.on{opacity:1}
.empty{text-align:center;padding:18px 6px}
.empty p{margin:0 0 12px}
.empty .btn{margin:4px}
.acct{border:1px solid var(--line);background:var(--card);border-radius:10px;min-height:34px;padding:0 10px;cursor:pointer;font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px;max-width:150px}
.acct .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.acct .st{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.acct .st.saved{background:var(--accent)} .acct .st.saving{background:#d9a400} .acct .st.error{background:var(--danger)}
.hdr-r{display:flex;gap:6px;align-items:center}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--card);width:100%;max-width:520px;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
@media (min-width:600px){.sheet-bg{align-items:center}.sheet{border-radius:18px}}
.sheet h2{margin:0 0 4px}
.sheet .stack{display:flex;flex-direction:column;gap:8px;margin-top:12px}
[hidden]{display:none!important}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1 data-i="title"></h1>
    <div class="hdr-r">
      <button class="acct" id="acctBtn" type="button"><span class="st" id="acctDot"></span><span class="nm" id="acctName"></span></button>
      <div class="langs" role="group" aria-label="Dil / Language">
        <button data-lang="tr">TR</button><button data-lang="en">EN</button><button data-lang="de">DE</button>
      </div>
    </div>
  </header>

  <section id="tab-players" hidden>
    <div class="card" id="formCard" hidden>
      <div class="row between"><h2 style="margin:0" id="formTitle"></h2><button class="btn ghost" id="pClose" aria-label="close">✕</button></div>
      <p class="small muted" data-i="formHint" style="margin:4px 0 0"></p>
      <form id="pform" autocomplete="off">
        <label class="f" for="pName" data-i="name"></label>
        <input type="text" id="pName" maxlength="30" enterkeyhint="done">

        <label class="f"><span data-i="rating"></span> <span class="opt" data-i="optional"></span></label>
        <div class="range-row">
          <input type="range" id="pRating" min="1" max="10" step="0.5" value="5" aria-label="rating">
          <span class="range-val" id="pRatingVal">–</span>
        </div>
        <label class="check"><input type="checkbox" id="pRatingUnknown"> <span data-i="unknown"></span></label>

        <label class="f"><span data-i="positions"></span> <span class="opt" data-i="optional"></span></label>
        <div class="chips" id="pPositions"></div>

        <label class="f"><span data-i="fitness"></span> <span class="opt" data-i="optional"></span></label>
        <div class="seg" id="pFitness"></div>

        <div class="row" style="margin-top:16px">
          <button class="btn primary" type="submit" style="flex:1" data-i="save"></button>
          <button class="btn danger" type="button" id="pDelete" data-i="delete" hidden></button>
        </div>
      </form>
    </div>

    <div class="card">
      <div class="row between"><h2 style="margin:0" id="rosterTitle"></h2><button class="btn primary" id="pAdd" data-i="add"></button></div>
      <div id="rosterList" style="margin-top:10px"></div>
      <div class="empty" id="rosterEmpty" hidden>
        <p class="muted" data-i="noPlayers2"></p>
      </div>
    </div>
  </section>

  <section id="tab-match" hidden>
    <div class="card">
      <div class="row between">
        <h2 style="margin:0" id="attTitle"></h2>
        <div class="row" style="gap:0">
          <button class="btn ghost" id="attAll" data-i="all"></button>
          <button class="btn ghost" id="attNone" data-i="none"></button>
        </div>
      </div>
      <div class="att" id="attList" style="margin-top:10px"></div>
      <div class="empty" id="attEmpty" hidden>
        <p class="muted" data-i="noPlayers"></p>
        <button class="btn" data-goto="players" data-i="addPlayers"></button>
      </div>
      <div id="attOptions">
        <label class="switch" style="margin-top:10px"><span><span data-i="rotateGk"></span><small data-i="rotateGkHelp"></small></span><input type="checkbox" id="optRotate"></label>
        <details class="opts">
          <summary data-i="more"></summary>
          <label class="check"><input type="checkbox" id="optRepeat"> <span data-i="avoidRepeat"></span></label>
          <label class="check"><input type="checkbox" id="optForm"> <span data-i="useForm"></span></label>
        </details>
      </div>
      <div class="sticky" id="genWrap"><button class="btn primary block" id="genBtn"></button></div>
    </div>

    <div id="resultArea" hidden>
      <div class="card">
        <div class="balance"><span class="a" id="sumA"></span><div class="meter"><i id="meterA"></i></div><span class="b" id="sumB"></span></div>
        <p class="small muted" id="info" style="margin:6px 0 0"></p>
        <div class="pitch-wrap" id="pitch" style="margin-top:10px"></div>
        <div class="row" style="margin-top:10px">
          <button class="btn" id="anotherBtn" style="flex:1" data-i="another"></button>
          <button class="btn" id="copyBtn" style="flex:1" data-i="share"></button>
        </div>
        <div class="teams" id="teams"></div>
        <p class="small muted" data-i="swapHint" style="margin:6px 0 0"></p>
      </div>
      <div class="card">
        <h2 data-i="result"></h2>
        <div class="score">
          <div><div class="small" style="text-align:center;font-weight:700;color:var(--a)" data-i="red"></div>
            <div class="stepper"><button type="button" data-step="A,-1">−</button><output id="scA">0</output><button type="button" data-step="A,1">+</button></div></div>
          <div style="font-weight:800;font-size:22px;padding-top:18px">:</div>
          <div><div class="small" style="text-align:center;font-weight:700;color:var(--b)" data-i="blue"></div>
            <div class="stepper"><button type="button" data-step="B,-1">−</button><output id="scB">0</output><button type="button" data-step="B,1">+</button></div></div>
        </div>
        <div class="row" style="margin-top:12px;flex-wrap:nowrap">
          <input type="date" id="matchDate" style="flex:1;min-width:0" aria-label="date">
          <button class="btn primary" id="saveResult" data-i="saveResult"></button>
        </div>
      </div>
    </div>
  </section>


</div>

<nav class="tabs" role="tablist"><div class="in">
  <button role="tab" data-tab="players"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="9" cy="8" r="3.2"/><path d="M3 19c.6-3.2 3-5 6-5s5.4 1.8 6 5"/><circle cx="17" cy="9" r="2.5"/><path d="M16 14.2c2.4.2 4.3 1.8 4.9 4.8"/></svg><span data-i="tabPlayers"></span></button>
  <span class="flow" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h13M13 6l6 6-6 6"/></svg></span>
  <button role="tab" data-tab="match" id="navMatch"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 7.5l3.4 2.5-1.3 4h-4.2l-1.3-4z"/><path d="M12 3v4.5M15.4 10l4.3-1.4M14.1 14l2.6 3.7M9.9 14l-2.6 3.7M8.6 10L4.3 8.6"/></svg><span data-i="tabMatch"></span></button>
  
  
</div></nav>
<div class="sheet-bg" id="acctSheet" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="acctTitle">
    <div id="signedOut">
      <h2 id="acctTitle" data-i="signInTitle"></h2>
      <p class="small muted" style="margin:0" data-i="signInHelp"></p>
      <form class="stack" id="signForm" autocomplete="off">
        <input type="text" id="signName" maxlength="32" enterkeyhint="go" autocapitalize="words">
        <button class="btn primary" type="submit" id="signGo" data-i="signInBtn"></button>
        <button class="btn" type="button" id="signSkip" data-i="skip"></button>
      </form>
      <p class="small muted" style="margin:10px 0 0" data-i="publicNote"></p>
      <p class="small muted" style="margin:4px 0 0" data-i="guestNote"></p>
    </div>
    <div id="signedIn" hidden>
      <h2 id="acctHello"></h2>
      <p class="small muted" style="margin:0" id="acctStatus"></p>
      <div class="stack">
        <button class="btn" type="button" id="signClose" data-i="close"></button>
        <button class="btn danger" type="button" id="signOut" data-i="signOut"></button>
      </div>
    </div>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>

const POS=["GK","DEF","MID","FWD"];

    const pos=Array.isArray(p.positions)?p.positions.filter(x=>POS.includes(x)):[];
    if(POS.includes(p.pref)&&!pos.includes(p.pref)) pos.unshift(p.pref);
    return {id:String(p.id),name:String(p.name).slice(0,30),
      rating:(typeof p.rating==="number"&&p.rating>=1&&p.rating<=10)?p.rating:null,
      positions:pos,fitness:(typeof p.fitness==="number"&&p.fitness>=1&&p.fitness<=5)?p.fitness:null};
  });
  const ids=new Set(s.players.map(p=>p.id));

  s.matches=Array.isArray(d.matches)?d.matches.filter(m=>m&&Array.isArray(m.a)&&Array.isArray(m.b)).map(m=>({
    id:String(m.id||uid()),date:String(m.date||""),a:m.a.map(String),b:m.b.map(String),scoreA:+m.scoreA||0,scoreB:+m.scoreB||0})):[];

}

function statsMap(){
  const m={}; S.players.forEach(p=>m[p.id]={played:0,w:0,d:0,l:0});
  S.matches.forEach(x=>{
    const r=x.scoreA>x.scoreB?"A":x.scoreA<x.scoreB?"B":"D";
    x.a.forEach(id=>{ const s=m[id]; if(!s) return; s.played++; r==="A"?s.w++:r==="D"?s.d++:s.l++; });
    x.b.forEach(id=>{ const s=m[id]; if(!s) return; s.played++; r==="B"?s.w++:r==="D"?s.d++:s.l++; });
  });
  return m;
}
function strengthMap(){
  const st=statsMap(),str={};
  S.players.forEach(p=>{
    let s=p.rating??5;
    if(p.fitness) s+=(p.fitness-3)*0.25;
    const x=st[p.id];
    if(S.settings.useForm&&x.played>=3) s+=Math.max(-0.75,Math.min(0.75,((x.w+x.d*0.5)/x.played-0.5)*1.5));
    str[p.id]=s;

}

function rng32(a){ return ()=>{ a|=0; a=a+0x6D2B79F5|0; let q=Math.imul(a^a>>>15,1|a); q=q+Math.imul(q^q>>>7,61|q)^q; return ((q^q>>>14)>>>0)/4294967296; }; }

const pk=(x,y)=>x<y?x+"|"+y:y+"|"+x;
function lastPairs(){
  const set=new Set(),last=S.matches[S.matches.length-1];
  if(last) [last.a,last.b].forEach(T=>{ for(let i=0;i<T.length;i++) for(let j=i+1;j<T.length;j++) set.add(pk(T[i],T[j])); });
  return set;
}
function balance(ids){
  const str=strengthMap(),P=ids.map(byId).filter(Boolean),n=P.length,nA=Math.ceil(n/2);
  const gkTotal=P.filter(p=>canPlay(p,"GK")).length;
  const useGk=!S.settings.rotateGk&&gkTotal>=2;
  const pairs=S.settings.avoidRepeat?lastPairs():new Set();
  const cost=(A,B)=>{
    const sA=A.reduce((a,p)=>a+str[p.id],0),sB=B.reduce((a,p)=>a+str[p.id],0);
    let c=(sA-sB)**2;
    if(useGk){ const gA=A.filter(p=>canPlay(p,"GK")).length,gB=B.filter(p=>canPlay(p,"GK")).length; if(!gA||!gB) c+=6; c+=0.3*(gA-gB)**2; }
    for(const pos of ["DEF","MID","FWD"]) c+=0.5*(A.filter(p=>canPlay(p,pos)).length-B.filter(p=>canPlay(p,pos)).length)**2;
    const mA=Math.max(...A.map(p=>str[p.id])),mB=Math.max(...B.map(p=>str[p.id]));
    c+=0.4*(mA-mB)**2;
    if(pairs.size){ let r=0; for(const T of [A,B]) for(let i=0;i<T.length;i++) for(let j=i+1;j<T.length;j++) if(pairs.has(pk(T[i].id,T[j].id))) r++; c+=0.06*r; }
    return c;
  };
  const rnd=rng32(hash(ids.slice().sort().join(",")+(S.settings.rotateGk?"r":"")));
  const seen=new Map(),restarts=Math.min(300,40+n*8);
  for(let r=0;r<restarts;r++){
    const arr=P.slice(); for(let i=arr.length-1;i>0;i--){ const j=Math.floor(rnd()*(i+1)); [arr[i],arr[j]]=[arr[j],arr[i]]; }
    let A=arr.slice(0,nA),B=arr.slice(nA),c=cost(A,B),go=true;
    while(go){ go=false; let best=c,bi=-1,bj=-1;
      for(let i=0;i<A.length;i++) for(let j=0;j<B.length;j++){ const a2=A.slice(),b2=B.slice(); a2[i]=B[j]; b2[j]=A[i]; const c2=cost(a2,b2); if(c2<best-1e-9){best=c2;bi=i;bj=j;} }
      if(bi>=0){ const x=A[bi]; A[bi]=B[bj]; B[bj]=x; c=best; go=true; } }
    const kA=A.map(p=>p.id).sort().join(),kB=B.map(p=>p.id).sort().join();
    const key=(n%2===0&&kB<kA)?kB+"/"+kA:kA+"/"+kB;
    if(!seen.has(key)) seen.set(key,{a:A.map(p=>p.id),b:B.map(p=>p.id),cost:c});
  }
  return [...seen.values()].sort((x,y)=>x.cost-y.cost||(x.a.join()<y.a.join()?-1:1)).slice(0,10);
}

const F={1:[0,0,0,1],2:[1,0,0,1],3:[1,1,0,1],4:[1,1,1,1],5:[1,2,1,1],6:[1,2,2,1],7:[1,2,3,1],8:[1,3,3,1],9:[1,3,3,2],10:[1,3,4,2],11:[1,4,4,2]};
const formation=n=>(F[n]||[1,4,4,n-9]).slice();
const teamRotates=ids=>S.settings.rotateGk||!ids.some(id=>canPlay(byId(id),"GK"));
function assignSlots(ids,str){
  const P=ids.map(byId).filter(Boolean),rotate=teamRotates(ids);
  let f;
  if(rotate){ f=formation(P.length+1); f[0]=0; const tot=f[1]+f[2]+f[3]; if(tot!==P.length) f[2]+=P.length-tot; }
  else f=formation(P.length);
  const slots=[]; f.forEach((c,i)=>{ for(let k=0;k<c;k++) slots.push(POS[i]); });
  const cost=(p,pos)=>{
    if(pos==="GK") return p.positions[0]==="GK"?0:canPlay(p,"GK")?1:6;
    if(p.positions[0]===pos) return 0;
    if(canPlay(p,pos)) return 1;
    if(!p.positions.length) return 1.5;
    if(p.positions.length===1&&p.positions[0]==="GK") return 4;
    return 3;
  };
  const res=[],fp=P.slice(),fs=slots.map((s,i)=>({s,i}));

    let b=null;
    for(const p of fp) for(const sl of fs){ const c=cost(p,sl.s)-str[p.id]*0.001; if(!b||c<b.c) b={c,p,sl}; }
    res.push({id:b.p.id,pos:b.sl.s}); fp.splice(fp.indexOf(b.p),1); fs.splice(fs.indexOf(b.sl),1);
  }
  fp.forEach(p=>res.push({id:p.id,pos:"MID"}));
  const o={GK:0,DEF:1,MID:2,FWD:3};
  return {rotate,slots:res.sort((x,y)=>o[x.pos]-o[y.pos]||str[y.id]-str[x.id])};

  const info=[],noR=[...a,...b].map(byId).filter(p=>p.rating==null).length;
  if(noR) info.push(t("infoNoRating",{n:noR})); if(ui.edited) info.push(t("edited"));
  $("#info").textContent=info.join(" "); $("#info").hidden=!info.length;
  const TA=assignSlots(a,str),TB=assignSlots(b,str); ui.slots={A:TA,B:TB};
  $("#pitch").innerHTML=pitchSvg(TA,TB);
  const list=(X,T)=>`<div class="team ${X}"><h3>${esc(teamLabel(X))} · ${T.slots.length}</h3>`+
    (T.rotate?`<div class="tp" style="cursor:default;opacity:.75"><span class="pos">${esc(L().posShort.GK)}</span><span class="nm">↻ ${esc(t("rotating"))}</span></div>`:"")+
    T.slots.map(s=>`<div class="tp${ui.selected&&ui.selected.id===s.id?" sel":""}" data-team="${X}" data-id="${esc(s.id)}"><span class="pos">${esc(L().posShort[s.pos])}</span><span class="nm">${esc(byId(s.id).name)}</span><span class="r">${f1(str[s.id])}</span></div>`).join("")+`</div>`;
  $("#teams").innerHTML=list("A",TA)+list("B",TB);
  $("#scA").textContent=ui.scA; $("#scB").textContent=ui.scB;
  if(!$("#matchDate").value) $("#matchDate").value=today();
}

const blankForm=()=>({name:"",rating:5,unknown:true,positions:[],fitness:null});
function renderPlayers(){
  $("#formCard").hidden=!ui.formOpen;
  if(ui.formOpen){
    const f=ui.form;
    $("#formTitle").textContent=ui.editId?t("formEdit"):t("formAdd");
    if($("#pName").value!==f.name) $("#pName").value=f.name;
    $("#pRating").value=f.rating; $("#pRatingUnknown").checked=f.unknown;
    $("#pRatingVal").textContent=f.unknown?"–":f1(f.rating);
    $("#pRating").style.opacity=f.unknown?.45:1;
    $("#pPositions").innerHTML=POS.map(p=>`<button type="button" class="chip" data-pos="${p}" aria-pressed="${f.positions.includes(p)}">${esc(L().pos[p])}</button>`).join("");
    $("#pFitness").innerHTML=`<button type="button" data-fit="" aria-pressed="${f.fitness==null}">–</button>`+[1,2,3,4,5].map(n=>`<button type="button" data-fit="${n}" aria-pressed="${f.fitness===n}">${n}</button>`).join("");
    $("#pDelete").hidden=!ui.editId;
  }
  const st=statsMap();
  $("#rosterTitle").textContent=t("rosterTitle",{n:S.players.length});
  $("#rosterEmpty").hidden=S.players.length>0;
  $("#rosterList").innerHTML=S.players.slice().sort((a,b)=>a.name.localeCompare(b.name,S.lang)).map(p=>{
    const pos=p.positions.map(x=>L().posShort[x]).join(" ");
    const miss=p.rating==null||!p.positions.length;
    return `<button type="button" class="prow" data-edit="${esc(p.id)}"><span class="rt">${p.rating==null?"–":f1(p.rating)}</span><span class="nm">${esc(p.name)}</span>`+
      (miss?`<span class="dot"></span>`:"")+`<span class="meta">${esc(pos)}${pos?" · ":""}${st[p.id].played} ${esc(t("games"))}</span></button>`;
  }).join("");
}
function openForm(id){
  ui.formOpen=true; ui.editId=id||null;
  const p=id&&byId(id);
  ui.form=p?{name:p.name,rating:p.rating??5,unknown:p.rating==null,positions:p.positions.slice(),fitness:p.fitness}:blankForm();
  $("#pName").value=ui.form.name;
  renderPlayers(); window.scrollTo({top:0,behavior:"smooth"});
}
function closeForm(){ ui.formOpen=false; ui.editId=null; renderPlayers(); }
function savePlayer(e){
  e.preventDefault(); const f=ui.form; f.name=$("#pName").value; const name=f.name.trim();
  if(!name){ toast(t("nameRequired")); return; }
  if(S.players.some(p=>p.name.toLowerCase()===name.toLowerCase()&&p.id!==ui.editId)){ toast(t("nameExists")); return; }
  const data={name,rating:f.unknown?null:+f.rating,positions:f.positions.slice(),fitness:f.fitness};
  const wasEdit=!!ui.editId;
  if(wasEdit) Object.assign(byId(ui.editId),data); else S.players.push({id:uid(),...data});
  save(); toast(t("saved"));
  if(wasEdit) closeForm(); else { ui.form=blankForm(); $("#pName").value=""; renderPlayers(); }
}
function deletePlayer(){
  const p=byId(ui.editId); if(!p||!confirm(t("confirmDelete",{name:p.name}))) return;
  S.players=S.players.filter(x=>x.id!==p.id); S.attending=S.attending.filter(id=>id!==p.id);
  S.matches.forEach(m=>{ m.a=m.a.filter(id=>id!==p.id); m.b=m.b.filter(id=>id!==p.id); });
  save(); closeForm();
}
function generate(scroll){
  if(S.attending.length<2) return;
  ui.options=balance(S.attending.slice()); ui.variant=0; setOption();
  if(scroll!==false) setTimeout(()=>$("#resultArea").scrollIntoView({behavior:"smooth",block:"start"}),30);
}
function setOption(){ const o=ui.options[ui.variant]; ui.teams={a:o.a.slice(),b:o.b.slice()}; ui.edited=false; ui.selected=null; ui.scA=0; ui.scB=0; renderTeams(); }
function pick(team,id){
  if(!ui.selected||ui.selected.team===team) ui.selected=(ui.selected&&ui.selected.id===id)?null:{team,id};
  else { const A=ui.teams.a,B=ui.teams.b,aId=team==="A"?id:ui.selected.id,bId=team==="B"?id:ui.selected.id;
    A[A.indexOf(aId)]=bId; B[B.indexOf(bId)]=aId; ui.selected=null; ui.edited=true; }
  renderTeams();
}
function share(){
  if(!ui.teams) return;
  const block=(X,T)=>`*${teamLabel(X)}*\n`+(T.rotate?`${L().posShort.GK} ↻ ${t("rotating")}\n`:"")+T.slots.map(s=>`${L().posShort[s.pos]} ${byId(s.id).name}`).join("\n");
  const txt=`⚽ ${$("#matchDate").value||today()}\n\n${block("A",ui.slots.A)}\n\n${block("B",ui.slots.B)}`;
  if(navigator.share){ navigator.share({text:txt}).catch(()=>{}); return; }
  const done=()=>toast(t("copied"));
  if(navigator.clipboard&&window.isSecureContext) navigator.clipboard.writeText(txt).then(done,()=>fallback(txt,done)); else fallback(txt,done);
}
function fallback(txt,done){ const ta=document.createElement("textarea"); ta.value=txt; ta.style.cssText="position:fixed;opacity:0"; document.body.appendChild(ta); ta.select(); try{document.execCommand("copy");done();}catch(e){} ta.remove(); }
function saveResult(){
  if(!ui.teams) return;
  S.matches.push({id:uid(),date:$("#matchDate").value||today(),a:ui.teams.a.slice(),b:ui.teams.b.slice(),scoreA:ui.scA,scoreB:ui.scB});
  save(); ui.teams=null; ui.scA=ui.scB=0; toast(t("resultSaved")); render(); window.scrollTo({top:0,behavior:"smooth"});
}

$(".langs").addEventListener("click",e=>{ const b=e.target.closest("[data-lang]"); if(!b) return; setLang(b.dataset.lang); save(); render(); });
$("nav.tabs").addEventListener("click",e=>{ const b=e.target.closest("[data-tab]"); if(b) showTab(b.dataset.tab); });
document.addEventListener("click",e=>{ const g=e.target.closest("[data-goto]"); if(g){ showTab(g.dataset.goto); openForm(); } });
$("#attList").addEventListener("click",e=>{ const b=e.target.closest("[data-id]"); if(!b) return; const id=b.dataset.id;
  S.attending=S.attending.includes(id)?S.attending.filter(x=>x!==id):[...S.attending,id]; save(); renderMatch(); });
$("#attAll").addEventListener("click",()=>{ S.attending=S.players.map(p=>p.id); save(); renderMatch(); });
$("#attNone").addEventListener("click",()=>{ S.attending=[]; save(); renderMatch(); });
$("#optRotate").addEventListener("change",e=>{ S.settings.rotateGk=e.target.checked; save(); if(ui.teams) generate(false); });
$("#optRepeat").addEventListener("change",e=>{ S.settings.avoidRepeat=e.target.checked; save(); });
$("#optForm").addEventListener("change",e=>{ S.settings.useForm=e.target.checked; save(); renderTeams(); });
$("#genBtn").addEventListener("click",()=>generate());
$("#anotherBtn").addEventListener("click",()=>{ if(!ui.options) return; ui.variant=(ui.variant+1)%ui.options.length; setOption(); });
$("#copyBtn").addEventListener("click",share);
$("#teams").addEventListener("click",e=>{ const el=e.target.closest("[data-id]"); if(el) pick(el.dataset.team,el.dataset.id); });
$("#pitch").addEventListener("click",e=>{ const el=e.target.closest("[data-id]"); if(el) pick(el.dataset.team,el.dataset.id); });
document.querySelectorAll("[data-step]").forEach(b=>b.addEventListener("click",()=>{ const [X,d]=b.dataset.step.split(","),k="sc"+X; ui[k]=Math.max(0,Math.min(99,ui[k]+(+d))); $("#"+k).textContent=ui[k]; }));
$("#saveResult").addEventListener("click",saveResult);

$("#pAdd").addEventListener("click",()=>openForm());
$("#pClose").addEventListener("click",closeForm);
$("#pform").addEventListener("submit",savePlayer);
$("#pName").addEventListener("input",e=>{ if(ui.form) ui.form.name=e.target.value; });
$("#pRating").addEventListener("input",e=>{ ui.form.rating=+e.target.value; ui.form.unknown=false; $("#pRatingUnknown").checked=false; $("#pRatingVal").textContent=f1(ui.form.rating); e.target.style.opacity=1; });
$("#pRatingUnknown").addEventListener("change",e=>{ ui.form.unknown=e.target.checked; renderPlayers(); });
$("#pPositions").addEventListener("click",e=>{ const b=e.target.closest("[data-pos]"); if(!b) return; const p=b.dataset.pos,f=ui.form; f.positions=f.positions.includes(p)?f.positions.filter(x=>x!==p):[...f.positions,p]; renderPlayers(); });
$("#pFitness").addEventListener("click",e=>{ const b=e.target.closest("[data-fit]"); if(!b) return; ui.form.fitness=b.dataset.fit?+b.dataset.fit:null; renderPlayers(); });
$("#pDelete").addEventListener("click",deletePlayer);
$("#rosterList").addEventListener("click",e=>{ const b=e.target.closest("[data-edit]"); if(b) openForm(b.dataset.edit); });

/* ---------- account: name-only sign-in, autosave to the Pi ---------- */
const ACCT_KEY="football-account", SEEN_KEY="football-welcome-seen";
const acct={name:null,status:"local"};
try{ acct.name=localStorage.getItem(ACCT_KEY)||null; }catch(e){}
const slugOk=n=>n.normalize("NFKD").replace(/[^A-Za-z0-9ıİşŞğĞçÇöÖüÜ]+/g,"").length>=2;
const apiUrl=n=>new URL("api/data/"+encodeURIComponent(n.trim()),location.href).toString();
let syncTimer=null, retryTimer=null;
function setStatus(st){ acct.status=st; renderAcct(); }
function scheduleSync(){ if(!acct.name) return; setStatus("saving"); clearTimeout(syncTimer); syncTimer=setTimeout(pushNow,700); }
async function pushNow(){
  if(!acct.name) return;
  clearTimeout(retryTimer);
  try{
    const r=await fetch(apiUrl(acct.name),{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(S)});
    if(!r.ok) throw new Error(r.status);
    setStatus("saved");
  }catch(e){ setStatus("error"); retryTimer=setTimeout(pushNow,15000); }
}
async function pullFromServer(name){
  const r=await fetch(apiUrl(name),{cache:"no-store"});
  if(r.status===404) return null;
  if(!r.ok) throw new Error(r.status);
  return sanitize(await r.json());
}
async function signIn(name){
  name=name.trim();
  if(!slugOk(name)){ toast(t("badName")); return; }
  $("#signGo").disabled=true;
  try{
    const d=await pullFromServer(name);
    if(d && S.players.length && !confirm(t("confirmReplace"))) return;
    acct.name=name; try{ localStorage.setItem(ACCT_KEY,name); localStorage.setItem(SEEN_KEY,"1"); }catch(e){}
    if(d){ const lang=S.lang; S=d; S.lang=lang; saveLocal(); ui.teams=null; toast(t("loadedFromServer")); setStatus("saved"); }
    else { await pushNow(); }
    closeSheet(); render();
  }catch(e){ toast(t("serverError")); }
  finally{ $("#signGo").disabled=false; }
}
function signOut(){
  acct.name=null; clearTimeout(syncTimer); clearTimeout(retryTimer);
  try{ localStorage.removeItem(ACCT_KEY); localStorage.removeItem(KEY); }catch(e){}
  const lang=S.lang; S=defaults(); S.lang=lang;
  ui.teams=null; ui.formOpen=false; ui.editId=null;
  setStatus("local"); closeSheet(); showTab("players");
}
function renderAcct(){
  $("#acctName").textContent=acct.name||t("signIn");
  $("#acctDot").className="st"+(acct.name?" "+acct.status:"");
  $("#acctDot").hidden=!acct.name;
  $("#signedOut").hidden=!!acct.name; $("#signedIn").hidden=!acct.name;
  if(acct.name){
    $("#acctHello").textContent=t("hello",{name:acct.name});
    $("#acctStatus").textContent=t(acct.status==="error"?"stError":acct.status==="saving"?"stSaving":"stSaved");
  }
}
function openSheet(){ renderAcct(); $("#acctSheet").hidden=false; if(!acct.name) setTimeout(()=>$("#signName").focus(),60); }
function closeSheet(){ $("#acctSheet").hidden=true; try{ localStorage.setItem(SEEN_KEY,"1"); }catch(e){} }
const _render=render; render=function(){ _render(); renderAcct(); $("#signName").placeholder=t("name"); };
$("#acctBtn").addEventListener("click",openSheet);
$("#signForm").addEventListener("submit",e=>{ e.preventDefault(); signIn($("#signName").value); });
$("#signSkip").addEventListener("click",closeSheet);
$("#signClose").addEventListener("click",closeSheet);
$("#signOut").addEventListener("click",signOut);
$("#acctSheet").addEventListener("click",e=>{ if(e.target.id==="acctSheet") closeSheet(); });

showTab("players");
(async()=>{
  if(acct.name){
    setStatus("saving");
    try{ const d=await pullFromServer(acct.name);
      if(d){ const lang=S.lang; S=d; S.lang=lang; saveLocal(); render(); setStatus("saved"); } else pushNow();
    }catch(e){ setStatus("error"); }
  } else {
    openSheet();
  }
})();
</script>
